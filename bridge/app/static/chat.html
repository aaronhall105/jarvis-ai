<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#080b0f">
    <title>Jarvis AI</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #080b0f;
            --surface: #10171a;
            --surface-light: #152126;
            --border: #21473c;
            --accent: #37e69b;
            --accent-dark: #123d2e;
            --text: #e9fff5;
            --muted: #9fb5ac;
            --danger: #ff9d9d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-rows: auto 1fr auto;
            width: min(900px, 100%);
            height: 100dvh;
            margin: 0 auto;
            background: var(--background);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 68px;
            padding:
                calc(12px + env(safe-area-inset-top))
                18px
                12px;
            border-bottom: 1px solid var(--border);
            background: rgba(8, 11, 15, 0.96);
            backdrop-filter: blur(14px);
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .core {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            background: var(--accent-dark);
            color: var(--accent);
            font-weight: 800;
            box-shadow: 0 0 18px rgba(55, 230, 155, 0.22);
        }

        h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.2px;
        }

        .subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        #messages {
            overflow-y: auto;
            padding: 22px 16px 30px;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 680px;
            margin: 12vh auto 0;
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(18, 61, 46, 0.45),
                    rgba(16, 23, 26, 0.9)
                );
            text-align: center;
        }

        .welcome h2 {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 25px;
        }

        .welcome p {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .examples {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .example {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(8, 11, 15, 0.55);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .example:active {
            transform: scale(0.99);
        }

        .message {
            display: flex;
            width: 100%;
            max-width: 760px;
            margin: 0 auto 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: min(82%, 640px);
            padding: 13px 15px;
            border-radius: 17px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            border-bottom-right-radius: 5px;
            background: var(--accent-dark);
            color: #dffff1;
        }

        .assistant .bubble {
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
            background: var(--surface);
        }

        .error .bubble {
            border-color: #6d2929;
            background: #2a1515;
            color: var(--danger);
        }

        .tool-card {
            width: min(82%, 640px);
            margin-top: -10px;
            margin-bottom: 18px;
            margin-left: max(calc((100% - 760px) / 2), 0px);
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0b1214;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .tool-card strong {
            color: var(--accent);
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: pulse 1.1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes pulse {
            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        footer {
            padding:
                12px
                14px
                calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(8, 11, 15, 0.97);
        }

        form {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 760px;
            margin: 0 auto;
        }

        textarea {
            flex: 1;
            min-height: 48px;
            max-height: 140px;
            resize: none;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 16px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(55, 230, 155, 0.12);
        }

        button.send {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            border: 0;
            border-radius: 15px;
            background: var(--accent);
            color: #04110c;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
        }

        button.send:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .footer-note {
            max-width: 760px;
            margin: 7px auto 0;
            color: #64746d;
            font-size: 10px;
            text-align: center;
        }

        @media (min-width: 700px) {
            .app {
                border-right: 1px solid var(--border);
                border-left: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>
<div class="app">
    <header>
        <div class="identity">
            <div class="core">J</div>
            <div>
                <h1>Jarvis AI</h1>
                <div class="subtitle">Home intelligence system</div>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="statusText">Online</span>
        </div>
    </header>

    <main id="messages">
        <section class="welcome" id="welcome">
            <h2>Jarvis is ready</h2>
            <p>
                Ask a question or control your Home Assistant devices
                using natural language.
            </p>

            <div class="examples">
                <button
                    class="example"
                    type="button"
                    data-message="Turn the living room lights off"
                >
                    Turn the living room lights off
                </button>

                <button
                    class="example"
                    type="button"
                    data-message="Switch the living room lights back on"
                >
                    Switch the living room lights back on
                </button>

                <button
                    class="example"
                    type="button"
                    data-message="What can you currently control?"
                >
                    What can you currently control?
                </button>
            </div>
        </section>
    </main>

    <footer>
        <form id="chatForm">
            <textarea
                id="messageInput"
                rows="1"
                maxlength="500"
                autocomplete="off"
                placeholder="Message Jarvis..."
                aria-label="Message Jarvis"
            ></textarea>

            <button
                class="send"
                id="sendButton"
                type="submit"
                aria-label="Send message"
            >
                ↑
            </button>
        </form>

        <div class="footer-note">
            Jarvis only controls tools explicitly exposed by Jarvis Core.
        </div>
    </footer>
</div>

<script>
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("statusText");
    const conversationStorageKey = "jarvis.chat.conversationId";

    let requestInProgress = false;
    let pollPromise = null;
    let conversationId = loadConversationId();
    const renderedMessageIds = new Set();
    const pendingMessages = [];

    function loadConversationId() {
        try {
            return localStorage.getItem(conversationStorageKey) || null;
        } catch {
            return null;
        }
    }

    function saveConversationId(value) {
        conversationId = value || null;
        try {
            if (conversationId) {
                localStorage.setItem(conversationStorageKey, conversationId);
            } else {
                localStorage.removeItem(conversationStorageKey);
            }
        } catch {
            // The current page still retains the ID when storage is unavailable.
        }
    }

    function removeWelcome() {
        if (welcome && welcome.isConnected) {
            welcome.remove();
        }
    }

    function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(role, text, extraClass = "", messageId = null) {
        removeWelcome();

        const wrapper = document.createElement("div");
        wrapper.className = `message ${role} ${extraClass}`.trim();
        if (messageId !== null) {
            wrapper.dataset.messageId = String(messageId);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);
        scrollToBottom();

        return wrapper;
    }

    function addOptimisticMessage(role, text) {
        const pending = {role, content: text};
        pendingMessages.push(pending);
        addMessage(role, text);
        return pending;
    }

    function discardPendingMessage(pending) {
        const index = pendingMessages.indexOf(pending);
        if (index !== -1) {
            pendingMessages.splice(index, 1);
        }
    }

    function renderServerMessage(message) {
        const messageId = String(message.message_id ?? "");
        if (!messageId || renderedMessageIds.has(messageId)) {
            return;
        }

        const role = message.role === "user" ? "user" : "assistant";
        const content = String(message.content || "");
        const pendingIndex = pendingMessages.findIndex((pending) => (
            pending.role === role && pending.content === content
        ));

        if (pendingIndex !== -1) {
            pendingMessages.splice(pendingIndex, 1);
        } else {
            addMessage(role, content, "", messageId);
        }
        renderedMessageIds.add(messageId);
    }

    async function pollConversation() {
        if (!conversationId || requestInProgress || document.hidden) {
            return false;
        }
        if (pollPromise) {
            return pollPromise;
        }

        const requestedConversationId = conversationId;
        pollPromise = (async () => {
            const response = await fetch(
                `/api/conversations/${encodeURIComponent(requestedConversationId)}?limit=200`,
                {headers: {"Accept": "application/json"}},
            );

            if (response.status === 404) {
                if (conversationId === requestedConversationId) {
                    saveConversationId(null);
                }
                return false;
            }
            if (!response.ok) {
                return false;
            }

            const payload = await response.json();
            if (
                requestInProgress ||
                conversationId !== requestedConversationId ||
                !Array.isArray(payload.messages)
            ) {
                return false;
            }
            payload.messages.forEach(renderServerMessage);
            return true;
        })().catch((error) => {
            console.debug("Conversation polling is temporarily unavailable.", error);
            return false;
        }).finally(() => {
            pollPromise = null;
        });

        return pollPromise;
    }

    function addTypingIndicator() {
        removeWelcome();

        const wrapper = document.createElement("div");
        wrapper.className = "message assistant";
        wrapper.id = "typingIndicator";

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        const typing = document.createElement("span");
        typing.className = "typing";
        typing.innerHTML = "<span></span><span></span><span></span>";

        bubble.appendChild(typing);
        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        document.getElementById("typingIndicator")?.remove();
    }

    function formatToolCard(call) {
        const tool = call.tool || "Unknown tool";
        const argumentsValue = call.arguments || {};
        const result = call.result || {};

        const area = argumentsValue.area_id
            ? argumentsValue.area_id.replaceAll("_", " ")
            : "Unknown area";

        const action = argumentsValue.action
            ? argumentsValue.action.replaceAll("_", " ")
            : "Unknown action";

        const entities = Array.isArray(result.entities)
            ? result.entities.length
            : 0;

        return {
            tool,
            area,
            action,
            entities,
            success: Boolean(result.success),
        };
    }

    function addToolActivity(calls) {
        if (!Array.isArray(calls) || calls.length === 0) {
            return;
        }

        calls.forEach((call) => {
            const details = formatToolCard(call);

            const card = document.createElement("div");
            card.className = "tool-card";

            const state = details.success
                ? "Completed"
                : "Failed";

            card.innerHTML = `
                <strong>${state}: ${details.tool}</strong><br>
                Area: ${details.area}<br>
                Action: ${details.action}<br>
                Entities affected: ${details.entities}
            `;

            messages.appendChild(card);
        });

        scrollToBottom();
    }

    function setBusy(busy) {
        requestInProgress = busy;
        sendButton.disabled = busy;
        input.disabled = busy;
        statusText.textContent = busy ? "Thinking" : "Online";
    }

    function resizeInput() {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
    }

    async function sendMessage(text) {
        const message = text.trim();

        if (!message || requestInProgress) {
            return;
        }

        // Rehydrate a retained chat before adding a new optimistic turn so an
        // older identical message cannot be mistaken for this new one.
        if (conversationId && renderedMessageIds.size === 0) {
            await pollConversation();
            if (requestInProgress) {
                return;
            }
        }

        const requestId = typeof crypto.randomUUID === "function"
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`;

        const pendingUserMessage = addOptimisticMessage("user", message);

        input.value = "";
        resizeInput();
        setBusy(true);
        addTypingIndicator();

        try {
            const response = await fetch("/api/assistant/ai", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    text: message,
                    conversation_id: conversationId || undefined,
                    request_id: requestId,
                }),
            });

            let payload;

            try {
                payload = await response.json();
            } catch {
                payload = {};
            }

            removeTypingIndicator();

            if (!response.ok) {
                discardPendingMessage(pendingUserMessage);
                const detail =
                    payload.detail ||
                    `Jarvis returned HTTP ${response.status}.`;

                addMessage(
                    "assistant",
                    detail,
                    "error",
                );

                return;
            }

            if (
                typeof payload.conversation_id === "string" &&
                payload.conversation_id.trim()
            ) {
                saveConversationId(payload.conversation_id.trim());
            }

            addOptimisticMessage(
                "assistant",
                payload.response ||
                    "The request completed without a response.",
            );

            if (payload.tool_called) {
                addToolActivity(payload.calls);
            }
        } catch (error) {
            discardPendingMessage(pendingUserMessage);
            removeTypingIndicator();

            addMessage(
                "assistant",
                "Jarvis Core could not be reached. Check the server connection.",
                "error",
            );

            console.error(error);
        } finally {
            setBusy(false);
            input.focus();
            void pollConversation();
        }
    }

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(input.value);
    });

    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", (event) => {
        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {
            event.preventDefault();
            form.requestSubmit();
        }
    });

    document.querySelectorAll(".example").forEach((button) => {
        button.addEventListener("click", () => {
            sendMessage(button.dataset.message || "");
        });
    });

    window.setInterval(() => {
        void pollConversation();
    }, 4000);

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            void pollConversation();
        }
    });

    void pollConversation();
    input.focus();
</script>
</body>
</html>
