<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#080b0f">
    <title>Jarvis AI</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #080b0f;
            --surface: #10171a;
            --surface-light: #152126;
            --border: #21473c;
            --accent: #37e69b;
            --accent-dark: #123d2e;
            --text: #e9fff5;
            --muted: #9fb5ac;
            --danger: #ff9d9d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            color: var(--text);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        .app {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            width: min(900px, 100%);
            height: 100dvh;
            margin: 0 auto;
            background: var(--background);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 68px;
            padding:
                calc(12px + env(safe-area-inset-top))
                18px
                12px;
            border-bottom: 1px solid var(--border);
            background: rgba(8, 11, 15, 0.96);
            backdrop-filter: blur(14px);
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .core {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border: 1px solid var(--accent);
            border-radius: 50%;
            background: var(--accent-dark);
            color: var(--accent);
            font-weight: 800;
            box-shadow: 0 0 18px rgba(55, 230, 155, 0.22);
        }

        h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.2px;
        }

        .subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        .chat-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(8, 11, 15, 0.96);
            scrollbar-width: thin;
        }

        .chat-tab,
        .new-chat {
            min-width: 0;
            flex: 0 0 auto;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--surface);
            color: var(--muted);
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .chat-tab {
            width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
        }

        .chat-tab.active {
            border-color: var(--accent);
            background: var(--accent-dark);
            color: var(--text);
        }

        .new-chat {
            color: var(--accent);
            font-weight: 700;
        }

        #messages {
            overflow-y: auto;
            padding: 22px 16px 30px;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 680px;
            margin: 12vh auto 0;
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(18, 61, 46, 0.45),
                    rgba(16, 23, 26, 0.9)
                );
            text-align: center;
        }

        .welcome h2 {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 25px;
        }

        .welcome p {
            margin: 0;
            color: var(--muted);
            line-height: 1.55;
        }

        .examples {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .example {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(8, 11, 15, 0.55);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .example:active {
            transform: scale(0.99);
        }

        .message {
            display: flex;
            width: 100%;
            max-width: 760px;
            margin: 0 auto 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: min(82%, 640px);
            padding: 13px 15px;
            border-radius: 17px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user .bubble {
            border-bottom-right-radius: 5px;
            background: var(--accent-dark);
            color: #dffff1;
        }

        .assistant .bubble {
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
            background: var(--surface);
        }

        .error .bubble {
            border-color: #6d2929;
            background: #2a1515;
            color: var(--danger);
        }

        .tool-card {
            width: min(82%, 640px);
            margin-top: -10px;
            margin-bottom: 18px;
            margin-left: max(calc((100% - 760px) / 2), 0px);
            padding: 11px 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #0b1214;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .tool-card strong {
            color: var(--accent);
        }

        .typing {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: pulse 1.1s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes pulse {
            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        footer {
            padding:
                12px
                14px
                calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(8, 11, 15, 0.97);
        }

        form {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 760px;
            margin: 0 auto;
        }

        textarea {
            flex: 1;
            min-height: 48px;
            max-height: 140px;
            resize: none;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 16px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(55, 230, 155, 0.12);
        }

        button.send {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            border: 0;
            border-radius: 15px;
            background: var(--accent);
            color: #04110c;
            font-size: 22px;
            font-weight: 800;
            cursor: pointer;
        }

        button.send:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .footer-note {
            max-width: 760px;
            margin: 7px auto 0;
            color: #64746d;
            font-size: 10px;
            text-align: center;
        }

        @media (min-width: 700px) {
            .app {
                border-right: 1px solid var(--border);
                border-left: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>
<div class="app">
    <header>
        <div class="identity">
            <div class="core">J</div>
            <div>
                <h1>Jarvis AI</h1>
                <div class="subtitle">Home intelligence system</div>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            <span id="statusText">Online</span>
        </div>
    </header>

    <nav class="chat-tabs" id="chatTabs" aria-label="Conversations">
        <button class="new-chat" id="newChatButton" type="button">+ New chat</button>
    </nav>

    <main id="messages">
        <section class="welcome" id="welcome">
            <h2>Jarvis is ready</h2>
            <p>
                Ask a question or control your Home Assistant devices
                using natural language.
            </p>

            <div class="examples">
                <button
                    class="example"
                    type="button"
                    data-message="Turn the living room lights off"
                >
                    Turn the living room lights off
                </button>

                <button
                    class="example"
                    type="button"
                    data-message="Switch the living room lights back on"
                >
                    Switch the living room lights back on
                </button>

                <button
                    class="example"
                    type="button"
                    data-message="What can you currently control?"
                >
                    What can you currently control?
                </button>
            </div>
        </section>
    </main>

    <footer>
        <form id="chatForm">
            <textarea
                id="messageInput"
                rows="1"
                maxlength="500"
                autocomplete="off"
                placeholder="Message Jarvis..."
                aria-label="Message Jarvis"
            ></textarea>

            <button
                class="send"
                id="sendButton"
                type="submit"
                aria-label="Send message"
            >
                ↑
            </button>
        </form>

        <div class="footer-note">
            Jarvis only controls tools explicitly exposed by Jarvis Core.
        </div>
    </footer>
</div>

<script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("statusText");
    const chatTabs = document.getElementById("chatTabs");
    const newChatButton = document.getElementById("newChatButton");
    const storageKey = "jarvis-chat-tabs-v1";

    let requestInProgress = false;
    let state = loadState();

    function createId() {
        return globalThis.crypto?.randomUUID?.() ||
            `chat-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function createChat() {
        return {id: createId(), title: "New chat", items: []};
    }

    function loadState() {
        try {
            const saved = JSON.parse(localStorage.getItem(storageKey));
            if (Array.isArray(saved?.chats) && saved.chats.length &&
                saved.chats.some((chat) => chat.id === saved.activeId)) {
                return saved;
            }
        } catch (error) {
            console.warn("Unable to restore saved chats", error);
        }
        const chat = createChat();
        return {activeId: chat.id, chats: [chat]};
    }

    function saveState() {
        try {
            localStorage.setItem(storageKey, JSON.stringify(state));
        } catch (error) {
            console.warn("Unable to save chats", error);
        }
    }

    function activeChat() {
        return state.chats.find((chat) => chat.id === state.activeId);
    }

    function chatById(id) {
        return state.chats.find((chat) => chat.id === id);
    }

    function titleFrom(text) {
        const title = text.replace(/\s+/g, " ").trim();
        return title.length > 32 ? `${title.slice(0, 32)}…` : title;
    }

    function renderTabs() {
        chatTabs.querySelectorAll(".chat-tab").forEach((tab) => tab.remove());
        state.chats.forEach((chat) => {
            const tab = document.createElement("button");
            tab.type = "button";
            tab.className = `chat-tab${chat.id === state.activeId ? " active" : ""}`;
            tab.textContent = chat.title;
            tab.title = chat.title;
            tab.dataset.chatId = chat.id;
            tab.setAttribute("aria-current", chat.id === state.activeId ? "page" : "false");
            chatTabs.insertBefore(tab, newChatButton);
        });
        chatTabs.querySelector(".chat-tab.active")?.scrollIntoView({
            behavior: "smooth", block: "nearest", inline: "nearest",
        });
    }

    function renderWelcome() {
        const section = document.createElement("section");
        section.className = "welcome";
        section.id = "welcome";
        const heading = document.createElement("h2");
        heading.textContent = "Jarvis is ready";
        const copy = document.createElement("p");
        copy.textContent = "Ask a question or control your Home Assistant devices using natural language.";
        const examples = document.createElement("div");
        examples.className = "examples";
        [
            "Turn the living room lights off",
            "Switch the living room lights back on",
            "What can you currently control?",
        ].forEach((text) => {
            const button = document.createElement("button");
            button.className = "example";
            button.type = "button";
            button.dataset.message = text;
            button.textContent = text;
            examples.appendChild(button);
        });
        section.append(heading, copy, examples);
        messages.appendChild(section);
    }

    function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function renderMessage(role, text, extraClass = "") {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${role} ${extraClass}`.trim();
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);
    }

    function toolDetails(call) {
        const args = call.arguments || {};
        const result = call.result || {};
        return {
            tool: call.tool || "Unknown tool",
            area: args.area_id ? args.area_id.replaceAll("_", " ") : "Unknown area",
            action: args.action ? args.action.replaceAll("_", " ") : "Unknown action",
            entities: Array.isArray(result.entities) ? result.entities.length : 0,
            success: Boolean(result.success),
        };
    }

    function renderTools(calls) {
        calls.forEach((call) => {
            const details = toolDetails(call);
            const card = document.createElement("div");
            card.className = "tool-card";
            const heading = document.createElement("strong");
            heading.textContent = `${details.success ? "Completed" : "Failed"}: ${details.tool}`;
            card.append(heading, document.createElement("br"));
            card.append(`Area: ${details.area}`, document.createElement("br"));
            card.append(`Action: ${details.action}`, document.createElement("br"));
            card.append(`Entities affected: ${details.entities}`);
            messages.appendChild(card);
        });
    }

    function renderActiveChat() {
        messages.replaceChildren();
        const chat = activeChat();
        if (!chat?.items.length) {
            renderWelcome();
            return;
        }
        chat.items.forEach((item) => {
            if (item.kind === "tool") renderTools(item.calls);
            else renderMessage(item.role, item.text, item.extraClass || "");
        });
        scrollToBottom();
    }

    function addItem(chatId, item) {
        const chat = chatById(chatId);
        if (!chat) return;
        chat.items.push(item);
        saveState();
        if (chatId !== state.activeId) return;
        document.getElementById("welcome")?.remove();
        if (item.kind === "tool") renderTools(item.calls);
        else renderMessage(item.role, item.text, item.extraClass || "");
        scrollToBottom();
    }

    function addTypingIndicator() {
        document.getElementById("welcome")?.remove();
        const wrapper = document.createElement("div");
        wrapper.className = "message assistant";
        wrapper.id = "typingIndicator";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const typing = document.createElement("span");
        typing.className = "typing";
        typing.innerHTML = "<span></span><span></span><span></span>";
        bubble.appendChild(typing);
        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);
        scrollToBottom();
    }

    function setBusy(busy) {
        requestInProgress = busy;
        sendButton.disabled = busy;
        input.disabled = busy;
        statusText.textContent = busy ? "Thinking" : "Online";
    }

    function resizeInput() {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
    }

    async function sendMessage(text) {
        const message = text.trim();
        if (!message || requestInProgress) return;

        const chat = activeChat();
        const chatId = chat.id;
        if (chat.title === "New chat") {
            chat.title = titleFrom(message);
            renderTabs();
        }
        addItem(chatId, {kind: "message", role: "user", text: message});
        input.value = "";
        resizeInput();
        setBusy(true);
        addTypingIndicator();

        try {
            const response = await fetch("/api/assistant/ai", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({text: message, conversation_id: chatId}),
            });
            let payload;
            try { payload = await response.json(); } catch { payload = {}; }
            document.getElementById("typingIndicator")?.remove();
            if (!response.ok) {
                addItem(chatId, {
                    kind: "message", role: "assistant", extraClass: "error",
                    text: payload.detail || `Jarvis returned HTTP ${response.status}.`,
                });
                return;
            }
            addItem(chatId, {
                kind: "message", role: "assistant",
                text: payload.response || "The request completed without a response.",
            });
            if (payload.tool_called && Array.isArray(payload.calls) && payload.calls.length) {
                addItem(chatId, {kind: "tool", calls: payload.calls});
            }
        } catch (error) {
            document.getElementById("typingIndicator")?.remove();
            addItem(chatId, {
                kind: "message", role: "assistant", extraClass: "error",
                text: "Jarvis Core could not be reached. Check the server connection.",
            });
            console.error(error);
        } finally {
            setBusy(false);
            input.focus();
        }
    }

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(input.value);
    });
    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });
    messages.addEventListener("click", (event) => {
        const example = event.target.closest(".example");
        if (example) sendMessage(example.dataset.message || "");
    });
    chatTabs.addEventListener("click", (event) => {
        const tab = event.target.closest(".chat-tab");
        if (!tab) return;
        state.activeId = tab.dataset.chatId;
        saveState();
        renderTabs();
        renderActiveChat();
        input.focus();
    });
    newChatButton.addEventListener("click", () => {
        const chat = createChat();
        state.chats.push(chat);
        state.activeId = chat.id;
        saveState();
        renderTabs();
        renderActiveChat();
        input.focus();
    });

    saveState();
    renderTabs();
    renderActiveChat();
    input.focus();
</script>

</body>
</html>
