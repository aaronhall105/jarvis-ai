services:
  jarvis-core:
    build:
      context: ./bridge
    container_name: jarvis-core
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
