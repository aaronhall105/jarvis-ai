name: Build Jarvis Unified Voice v17.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - conversation-engine
    paths:
      - android/jarvis-voice-client/**
      - .github/workflows/android-unified-voice-v17.3.0.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android/jarvis-voice-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore Jarvis debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-voice-debug-keystore-v1730-v1

      - name: Create Jarvis debug signing key when absent
        working-directory: .
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Jarvis Voice Debug,O=Aaron Hall,C=GB" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/jarvis-voice-client-v17.3.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-client-v17.3.0-debug
          path: android/jarvis-voice-client/app/build/outputs/apk/debug/jarvis-voice-client-v17.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
