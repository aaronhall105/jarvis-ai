services:
  jarvis-core:
    environment:
      JARVIS_SPEAKER_IDENTITY_ENABLED: "true"
      JARVIS_SPEAKER_IDENTITY_URL: "http://jarvis-speaker-verifier:8091"
      JARVIS_SPEAKER_IDENTITY_TIMEOUT_SECONDS: "3.0"
      JARVIS_SPEAKER_CAPTURE_DIAGNOSTICS: "false"
      JARVIS_SPEAKER_SUPPRESSION_ENABLED: "false"
    depends_on:
      jarvis-speaker-verifier:
        condition: service_healthy

  jarvis-speaker-verifier:
    build:
      context: ./speaker-verifier
    container_name: jarvis-speaker-verifier
    restart: unless-stopped
    environment:
      JARVIS_SPEAKER_DATA_DIR: "/data"
      JARVIS_SPEAKER_DB: "/data/jarvis_speakers.db"
      JARVIS_SPEAKER_MODEL_DIR: "/data/models/spkrec-ecapa-voxceleb"
      JARVIS_SPEAKER_IDENTIFY_THRESHOLD: "0.340"
      JARVIS_SPEAKER_AMBIGUITY_MARGIN: "0.035"
    volumes:
      - ./speaker-data:/data
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 600s
