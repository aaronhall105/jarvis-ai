name: Build Jarvis Assistant v19.0.0-alpha14

on:
  workflow_dispatch:
  push:
    branches:
      - conversation-engine
      - 'jarvis/**'
    paths:
      - android/jarvis-voice-client/**
      - bridge/app/realtime_voice.py
      - bridge/app/version.py
      - bridge/tests/test_realtime_voice.py
      - bridge/tests/test_release_alpha14.py
      - tools/prepare_android_wake_assets.sh
      - .github/workflows/android-jarvis-assistant-v19.0.0-alpha13.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare offline wake assets
        run: ./tools/prepare_android_wake_assets.sh

      - name: Restore Jarvis debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-voice-debug-keystore-v1730-v1

      - name: Create Jarvis debug signing key when absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Jarvis Voice Debug,O=Aaron Hall,C=GB" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Verify release/security invariants
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -Fq 'versionCode = 190140' android/jarvis-voice-client/app/build.gradle.kts
          grep -Fq 'versionName = "19.0.0-alpha14"' android/jarvis-voice-client/app/build.gradle.kts
          grep -Fq 'JARVIS_RELEASE = "19.0.0-alpha14"' bridge/app/version.py
          grep -Fq 'REALTIME_PROTOCOL_VERSION = 2' bridge/app/version.py
          grep -Fq 'RELEASE = "19.0.0-alpha14"' \
            android/jarvis-voice-client/app/src/main/java/com/aaron/jarvisvoice/JarvisVersion.java
          ! grep -RniE 'picovoice|porcupine|AccessKey' \
            android/jarvis-voice-client/app/src/main \
            android/jarvis-voice-client/app/build.gradle.kts

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            requirements-improver.txt

      - name: Install Core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install -r requirements-improver.txt

      - name: Test Alpha14 Core protocol/release
        env:
          PYTHONPATH: bridge
        run: |
          python -m compileall -q bridge/app
          python -m pytest -q \
            bridge/tests/test_realtime_voice.py \
            bridge/tests/test_release_alpha14.py

      - name: Android unit tests and debug APK
        working-directory: android/jarvis-voice-client
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: |
          cp android/jarvis-voice-client/app/build/outputs/apk/debug/app-debug.apk \
            android/jarvis-voice-client/app/build/outputs/apk/debug/jarvis-assistant-v19.0.0-alpha14-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-assistant-v19.0.0-alpha14-debug
          path: android/jarvis-voice-client/app/build/outputs/apk/debug/jarvis-assistant-v19.0.0-alpha14-debug.apk
          if-no-files-found: error
          retention-days: 30
