name: Jarvis approved artifact-only signing

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact approved current canonical squash SHA (not a feature head)
        required: true
        type: string
      reviewed_pr:
        description: Merged PR whose squash equals source_sha and whose security gate is clean
        required: true
        type: string

# No contents/deployments write, OIDC, PAT or publication credential.
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
  security-events: read

concurrency:
  group: jarvis-artifact-only
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  REVIEWED_PR: ${{ inputs.reviewed_pr }}

jobs:
  build:
    if: github.repository == 'aaronhall105/jarvis-ai' && github.ref == 'refs/heads/jarvis/unified-production'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      payload_sha256: ${{ steps.record.outputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require canonical provenance, protected checks and approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.artifact_signing gate
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with: {packages: platform-tools}
      - name: Install fixed SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: {gradle-version: '9.4.1'}
      - name: Validate product and prepare wake assets without signing secrets
        run: |
          set -Eeuo pipefail
          python3 tools/verify_product_baseline.py --skip-ref
          ./tools/prepare_android_wake_assets.sh
      - name: Test and build UNSIGNED Phone and Wear
        working-directory: android/jarvis-voice-client
        run: |
          set -Eeuo pipefail
          env -u JARVIS_SIGNING_STORE_FILE -u JARVIS_SIGNING_STORE_PASSWORD \
            -u JARVIS_SIGNING_KEY_ALIAS -u JARVIS_SIGNING_KEY_PASSWORD \
            ./gradlew --no-daemon :wearprotocol:test :app:testDebugUnitTest \
            :app:lintRelease :app:assembleRelease :wear:testDebugUnitTest \
            :wear:lintRelease :wear:assembleRelease
      - name: Stage only the unsigned APK pair
        run: |
          set -Eeuo pipefail
          mkdir -m 700 unsigned-artifacts
          install -m 600 android/jarvis-voice-client/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-artifacts/phone.apk
          install -m 600 android/jarvis-voice-client/wear/build/outputs/apk/release/wear-release-unsigned.apk unsigned-artifacts/wear.apk
      - id: record
        name: Bind unsigned bytes to exact source and recheck gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.artifact_signing record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned-artifacts/
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  sign:
    name: Operator approval — artifact only — ${{ inputs.source_sha }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: jarvis-artifact-signing
      deployment: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with: {packages: platform-tools}
      - name: Install fixed verifier/signing SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;36.0.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: incoming
          merge-multiple: true
      - name: Revalidate approval/source/bytes, sign and independently verify
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_SHA256: ${{ needs.build.outputs.payload_sha256 }}
          KEYSTORE_BASE64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: python3 -m tools.artifact_signing sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approved-artifact-only-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-artifacts/
          if-no-files-found: error
          retention-days: 30
          overwrite: false
