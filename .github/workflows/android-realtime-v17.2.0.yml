name: Build Jarvis Realtime Voice v17.2.0

on:
  workflow_dispatch:
  push:
    branches:
      - conversation-engine
    paths:
      - android/jarvis-voice-client/**
      - .github/workflows/android-realtime-v17.2.0.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android/jarvis-voice-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/jarvis-voice-client-v17.2.0-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-client-v17.2.0-debug
          path: android/jarvis-voice-client/app/build/outputs/apk/debug/jarvis-voice-client-v17.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
