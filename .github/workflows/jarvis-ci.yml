name: Jarvis CI

on:
  pull_request:
  push:
    branches: [main, conversation-engine, "jarvis/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            requirements-improver.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install -r requirements-improver.txt
      - name: Compile Core
        run: python -m compileall -q bridge/app
      - name: Core tests
        env:
          PYTHONPATH: bridge
        run: python -m pytest -q bridge/tests
      - name: Assist integration tests
        run: |
          python home_assistant/tests/test_streaming.py
          python home_assistant/tests/test_conversation_closure.py
          python home_assistant/tests/test_release_integrity.py home_assistant
          ./tools/build_assist_package.sh /tmp/jarvis-dist

  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            requirements-improver.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install -r requirements-improver.txt
      - name: Ruff correctness gate
        run: python -m ruff check --select E9,F63,F7,F82 bridge/app bridge/tests
      - name: Bandit high-severity repository scan
        run: python -m bandit -q -r bridge/app -lll
      - name: Dependency audit
        run: python -m pip_audit -r bridge/requirements.txt --progress-spinner off

  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Prepare offline wake assets
        run: ./tools/prepare_android_wake_assets.sh
      - name: Android unit tests and debug build
        working-directory: android/jarvis-voice-client
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
