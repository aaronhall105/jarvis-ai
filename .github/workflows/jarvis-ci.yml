name: Jarvis CI

on:
  pull_request:
    branches: [jarvis/unified-production]
  push:
    branches: [jarvis/unified-production]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            requirements-improver.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install -r requirements-improver.txt
      - name: Compile Core
        run: python -m compileall -q bridge/app developer_gateway
      - name: Core tests
        env:
          PYTHONPATH: bridge
        run: python -m pytest -q bridge/tests tools/tests developer_gateway/tests
      - name: Verify unified product baseline
        run: python tools/verify_product_baseline.py --skip-ref
      - name: Assist integration tests
        run: |
          python home_assistant/tests/test_streaming.py
          python home_assistant/tests/test_conversation_closure.py
          python home_assistant/tests/test_release_integrity.py home_assistant
          ./tools/build_assist_package.sh /tmp/jarvis-dist

  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            requirements-improver.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install -r requirements-improver.txt
      - name: Ruff correctness and format gates
        run: |
          python -m ruff check bridge/app bridge/tests developer_gateway tools
          python -m ruff format --check bridge/app bridge/tests developer_gateway tools
      - name: Mypy active-source gate
        run: >-
          python -m mypy bridge/app developer_gateway
          tools/generate_ota_manifest.py tools/generate_product_release_manifest.py
          tools/verify_product_baseline.py
      - name: Bandit high-severity repository scan
        run: python -m bandit -q -r bridge/app developer_gateway -lll
      - name: Dependency audit
        run: >-
          python -m pip_audit -r bridge/requirements.txt -r requirements-improver.txt
          -r developer_gateway/requirements.txt --progress-spinner off
      - name: Workflow and current-tree secret gates
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-git --no-banner --redact --verbose=false

  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Prepare offline wake assets
        run: ./tools/prepare_android_wake_assets.sh
      - name: Android and Wear unit tests, lint, and debug builds
        working-directory: android/jarvis-voice-client
        run: >-
          ./gradlew --no-daemon
          :wearprotocol:test
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug
