name: Jarvis CI

on:
  pull_request:
  push:
    branches: [main, conversation-engine, "jarvis/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            requirements-improver.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install -r requirements-improver.txt
      - name: Compile
        run: python -m compileall -q bridge/app
      - name: Test
        env:
          PYTHONPATH: bridge
        run: python -m pytest -q bridge/tests
      - name: Assist release integrity
        run: |
          python home_assistant/tests/test_streaming.py
          python home_assistant/tests/test_conversation_closure.py
          python home_assistant/tests/test_release_integrity.py home_assistant
          ./tools/build_assist_package.sh /tmp/jarvis-dist
      - name: Ruff
        run: python -m ruff check bridge/app bridge/tests
      - name: Bandit
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository-wide high-severity security scan"
          python -m bandit -q -r bridge/app -lll

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t CHANGED_PYTHON < <(
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- bridge/app |
              grep -E '\.py$' || true
          )

          if (( ${#CHANGED_PYTHON[@]} > 0 )); then
            echo "Strict scan for changed Core Python files:"
            printf '  %s\n' "${CHANGED_PYTHON[@]}"
            python -m bandit -q "${CHANGED_PYTHON[@]}"
          else
            echo "No Core Python files changed in this commit."
          fi
      - name: Dependency audit
        run: python -m pip_audit -r bridge/requirements.txt --progress-spinner off

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
