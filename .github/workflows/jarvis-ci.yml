name: Jarvis CI

on:
  pull_request:
  push:
    branches: [main, "jarvis/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bridge/requirements.txt
            requirements-improver.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install -r requirements-improver.txt
      - name: Compile
        run: python -m compileall -q bridge/app
      - name: Test
        run: python -m pytest -q bridge/tests
      - name: Ruff
        run: python -m ruff check bridge/app bridge/tests
      - name: Bandit
        run: python -m bandit -q -r bridge/app
      - name: Dependency audit
        run: python -m pip_audit -r bridge/requirements.txt --progress-spinner off

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
