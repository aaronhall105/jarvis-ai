name: Jarvis Android OTA release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'bridge/requirements.txt'}
      - name: Verify release invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Fq "versionName = \"$version\"" android/jarvis-voice-client/app/build.gradle.kts
          grep -Fq "RELEASE = \"$version\"" android/jarvis-voice-client/app/src/main/java/com/aaron/jarvisvoice/JarvisVersion.java
          grep -Fq "JARVIS_RELEASE = \"$version\"" bridge/app/version.py
          test "$(git rev-list -n1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git diff --check
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt -r requirements-improver.txt
      - name: Prepare deterministic Android assets
        run: ./tools/prepare_android_wake_assets.sh
      - name: Test Core and release tooling
        env: {PYTHONPATH: bridge}
        run: |
          python -m pytest -q bridge/tests tools/tests/test_generate_ota_manifest.py
          python -m ruff check --select E9,F63,F7,F82 bridge/app bridge/tests tools/generate_ota_manifest.py tools/tests/test_generate_ota_manifest.py
          python -m bandit -q -lll tools/generate_ota_manifest.py
      - name: Android unit tests and lint
        working-directory: android/jarvis-voice-client
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease
      - name: Restore stable signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Required stable signing secret is absent" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
      - name: Build stable signed release APK
        working-directory: android/jarvis-voice-client
        env:
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and name the exact tested APK
        env:
          EXPECTED_CERT: ${{ secrets.JARVIS_SIGNING_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          code="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' android/jarvis-voice-client/app/build.gradle.kts)"
          source="android/jarvis-voice-client/app/build/outputs/apk/release/app-release.apk"
          apk="jarvis-assistant-v${version}-release.apk"
          cp "$source" "$apk"
          apksigner verify --verbose --print-certs "$apk" > signing-report.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing-report.txt | head -1)"
          test -n "$EXPECTED_CERT" && test "${actual,,}" = "${EXPECTED_CERT,,}"
          aapt dump badging "$apk" | grep -F "package: name='com.aaron.jarvisvoice' versionCode='$code' versionName='$version'"
          sha256sum "$apk" > "$apk.sha256"
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.txt
          python tools/generate_ota_manifest.py --apk "$apk" --version "$version" --version-code "$code" \
            --commit "$GITHUB_SHA" --notes-file release-notes.txt --output update-manifest.json
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("'"$apk"'"); m=json.load(open("update-manifest.json")); assert m["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest(); assert m["apkSize"]==p.stat().st_size; assert m["commitSha"]=="'"$GITHUB_SHA"'"'
      - name: Publish immutable release assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"; apk="jarvis-assistant-v${version}-release.apk"
          prerelease=""; [[ "$version" == *-* ]] && prerelease="--prerelease"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" "$apk.sha256" update-manifest.json signing-report.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Jarvis $version" --notes-file release-notes.txt $prerelease
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" update-manifest.json signing-report.txt \
              --verify-tag --title "Jarvis $version" --notes-file release-notes.txt $prerelease
          fi
      - name: Publish validated channel feeds
        run: |
          set -Eeuo pipefail
          channel="$(python -c 'import json; print(json.load(open("update-manifest.json"))["channel"])')"
          git fetch origin ota-feeds:ota-feeds || git branch ota-feeds
          worktree="$RUNNER_TEMP/ota-feeds"
          git worktree add "$worktree" ota-feeds
          mkdir -p "$worktree/feeds"
          promote() {
            local target="$1" existing="$worktree/feeds/$1.json"
            if [[ ! -f "$existing" ]] || python - "$existing" update-manifest.json <<'PY'
          import json, sys
          old, new = (json.load(open(path)) for path in sys.argv[1:])
          raise SystemExit(0 if new["versionCode"] > old["versionCode"] else 1)
          PY
            then cp update-manifest.json "$existing"; fi
          }
          promote "$channel"
          if [[ "$channel" == stable ]]; then promote beta; promote alpha; fi
          if [[ "$channel" == beta ]]; then promote alpha; fi
          git -C "$worktree" add feeds
          if git -C "$worktree" diff --cached --quiet; then echo "Feeds already point to newer validated builds"; exit 0; fi
          git -C "$worktree" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish OTA $GITHUB_REF_NAME"
          git -C "$worktree" push origin ota-feeds
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ota-${{ github.ref_name }}
          path: |
            jarvis-assistant-*-release.apk
            jarvis-assistant-*-release.apk.sha256
            update-manifest.json
            signing-report.txt
          if-no-files-found: error
          retention-days: 30
