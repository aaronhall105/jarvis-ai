name: Jarvis Android OTA release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'bridge/requirements.txt'}
      - name: Verify release invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin jarvis/unified-production
          test "$(git rev-parse origin/jarvis/unified-production)" = "$GITHUB_SHA" || {
            echo "Releases must be tagged at the current jarvis/unified-production head" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -Fq "versionName = \"$version\"" android/jarvis-voice-client/app/build.gradle.kts
          grep -Fq "RELEASE = \"$version\"" android/jarvis-voice-client/app/src/main/java/com/aaron/jarvisvoice/JarvisVersion.java
          grep -Fq "JARVIS_RELEASE = \"$version\"" bridge/app/version.py
          test "$(git rev-list -n1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          python tools/verify_product_baseline.py --skip-ref
          git diff --check
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt -r requirements-improver.txt
      - name: Prepare deterministic Android assets
        run: ./tools/prepare_android_wake_assets.sh
      - name: Test Core and release tooling
        env: {PYTHONPATH: bridge}
        run: |
          python -m pytest -q bridge/tests tools/tests developer_gateway/tests
          python -m ruff check bridge/app bridge/tests developer_gateway tools
          python -m ruff format --check bridge/app bridge/tests developer_gateway tools
          python -m mypy bridge/app developer_gateway tools/generate_ota_manifest.py \
            tools/generate_product_release_manifest.py tools/verify_product_baseline.py
          python -m bandit -q -lll tools/generate_ota_manifest.py tools/generate_product_release_manifest.py
      - name: Android and Wear unit tests and lint
        working-directory: android/jarvis-voice-client
        run: >-
          ./gradlew --no-daemon
          :wearprotocol:test
          :app:testDebugUnitTest :app:lintRelease
          :wear:testDebugUnitTest :wear:lintRelease
      - name: Restore stable signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Required stable signing secret is absent" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
      - name: Build stable-signed phone and Wear release APKs
        working-directory: android/jarvis-voice-client
        env:
          JARVIS_SIGNING_STORE_FILE: ${{ runner.temp }}/jarvis-release.jks
          JARVIS_SIGNING_STORE_PASSWORD: ${{ secrets.JARVIS_SIGNING_STORE_PASSWORD }}
          JARVIS_SIGNING_KEY_ALIAS: ${{ secrets.JARVIS_SIGNING_KEY_ALIAS }}
          JARVIS_SIGNING_KEY_PASSWORD: ${{ secrets.JARVIS_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease
      - name: Verify and name the exact tested APKs
        env:
          EXPECTED_CERT: 009fd523f27cf94eb98917e17670804897e6378e5eccf1ce3ead680721691aac
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          code="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' android/jarvis-voice-client/app/build.gradle.kts)"
          source="android/jarvis-voice-client/app/build/outputs/apk/release/app-release.apk"
          wear_source="android/jarvis-voice-client/wear/build/outputs/apk/release/wear-release.apk"
          apk="jarvis-assistant-v${version}-release.apk"
          wear_apk="jarvis-wear-v${version}-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          apksigner="$ANDROID_HOME/build-tools/$build_tools/apksigner"
          aapt="$ANDROID_HOME/build-tools/$build_tools/aapt"
          test -x "$apksigner" && test -x "$aapt"
          cp "$source" "$apk"
          cp "$wear_source" "$wear_apk"
          "$apksigner" verify --verbose --print-certs "$apk" > signing-report.txt
          "$apksigner" verify --verbose --print-certs "$wear_apk" > wear-signing-report.txt
          actual="$(grep -m1 'certificate SHA-256 digest:' signing-report.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d '[:space:]:')"
          wear_actual="$(grep -m1 'certificate SHA-256 digest:' wear-signing-report.txt | sed -E 's/.*digest:[[:space:]]*//' | tr -d '[:space:]:')"
          [[ "$actual" =~ ^[[:xdigit:]]{64}$ ]]
          [[ "$wear_actual" =~ ^[[:xdigit:]]{64}$ ]]
          test -n "$EXPECTED_CERT" && test -n "$actual" && test -n "$wear_actual"
          echo "Built APK signing certificate: ${actual,,}"
          test "${actual,,}" = "${EXPECTED_CERT,,}" || {
            echo "Built APK certificate does not match JARVIS_SIGNING_CERT_SHA256" >&2
            exit 1
          }
          test "${wear_actual,,}" = "${EXPECTED_CERT,,}" || {
            echo "Built Wear APK certificate does not match JARVIS_SIGNING_CERT_SHA256" >&2
            exit 1
          }
          test "${actual,,}" = "${wear_actual,,}"
          echo "Verified APK signing certificate"
          "$aapt" dump badging "$apk" > apk-badging.txt
          "$aapt" dump badging "$wear_apk" > wear-apk-badging.txt
          grep -Fq "package: name='com.aaron.jarvisvoice' versionCode='$code' versionName='$version'" apk-badging.txt
          grep -Fq "package: name='com.aaron.jarvisvoice' versionCode='$code' versionName='$version'" wear-apk-badging.txt
          echo "Verified APK package/version: com.aaron.jarvisvoice $version ($code)"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > apk-manifest.txt
          "$aapt" dump xmltree "$wear_apk" AndroidManifest.xml > wear-apk-manifest.txt
          grep -Fq 'com.aaron.jarvisvoice.IntegrationsActivity' apk-manifest.txt
          grep -Fq 'android:scheme' apk-manifest.txt
          grep -Fq '="jarvis"' apk-manifest.txt
          grep -Fq '="integrations"' apk-manifest.txt
          grep -Fq '="/google"' apk-manifest.txt
          unzip -p "$apk" classes.dex > "$RUNNER_TEMP/classes.dex"
          unzip -p "$wear_apk" classes.dex > "$RUNNER_TEMP/wear-classes.dex"
          dexdump="$ANDROID_HOME/build-tools/$build_tools/dexdump"
          test -x "$dexdump"
          "$dexdump" -d "$RUNNER_TEMP/classes.dex" > "$RUNNER_TEMP/classes-dexdump.txt"
          "$dexdump" -d "$RUNNER_TEMP/wear-classes.dex" > "$RUNNER_TEMP/wear-classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/SettingsActivity;'\''' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/IntegrationsActivity;'\''' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/DeveloperClient;'\''' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/TurnRecoveryJournal;'\''' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/WearChannelListenerService;'\''' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'buildIntegrationsSection' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Open integrations & accounts' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Google, email, calendar, contacts and external services.' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'settings_integrations_open' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'J A R V I S' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'What can I help with?' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Clear current chat' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Only the current conversation will be removed.' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Chat history' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Improvements' "$RUNNER_TEMP/classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/wear/JarvisWearActivity;'\''' "$RUNNER_TEMP/wear-classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/wear/JarvisTileService;'\''' "$RUNNER_TEMP/wear-classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/wear/WearAssistantService;'\''' "$RUNNER_TEMP/wear-classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/wear/WearVoiceService;'\''' "$RUNNER_TEMP/wear-classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/wear/WearChannelManager;'\''' "$RUNNER_TEMP/wear-classes-dexdump.txt"
          grep -Fq 'Class descriptor  : '\''Lcom/aaron/jarvisvoice/protocol/WearWireProtocol;'\''' "$RUNNER_TEMP/wear-classes-dexdump.txt"
          "$aapt" dump resources "$apk" > apk-resources.txt
          grep -Fq 'com.aaron.jarvisvoice:drawable/jarvis_wordmark_master' apk-resources.txt
          grep -Fq 'com.aaron.jarvisvoice:drawable/control_delete_red' apk-resources.txt
          grep -Fq 'com.aaron.jarvisvoice:drawable/ic_launcher_foreground' apk-resources.txt
          grep -Fq 'com.aaron.jarvisvoice:drawable/ic_jarvis_status' apk-resources.txt
          grep -Fq 'com.aaron.jarvisvoice:mipmap/ic_launcher_round' apk-resources.txt
          {
            echo "Package: com.aaron.jarvisvoice"
            echo "Version: $version ($code)"
            echo "SettingsActivity: present with top-level Integrations runtime UI"
            echo "IntegrationsActivity: present and manifest-declared"
            echo "Deep link: jarvis://integrations/google"
            echo "Developer, delete-current-chat, realtime recovery, Wear bridge, and current branding: present"
            echo "Signer SHA-256: ${actual,,}"
          } > apk-inspection.txt
          {
            echo "Package: com.aaron.jarvisvoice"
            echo "Version: $version ($code)"
            echo "JarvisWearActivity, Tile, assistant, voice, channel manager, and shared WearWireProtocol: present"
            echo "Phone and Watch source commit: $GITHUB_SHA"
            echo "Signer SHA-256: ${wear_actual,,}"
          } > wear-apk-inspection.txt
          echo "Verified compiled Integrations Settings UI, activity, and deep link"
          sha256sum "$apk" > "$apk.sha256"
          sha256sum "$apk" "$wear_apk" > SHA256SUMS.txt
          notes_key="${version^^}"
          notes_key="${notes_key//./_}"
          notes_key="${notes_key//-/_}"
          notes_file="docs/releases/CHANGES_V${notes_key}.md"
          test -f "$notes_file"
          cp "$notes_file" release-notes.txt
          python tools/generate_ota_manifest.py --apk "$apk" --version "$version" --version-code "$code" \
            --commit "$GITHUB_SHA" --notes-file release-notes.txt --output update-manifest.json
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("'"$apk"'"); m=json.load(open("update-manifest.json")); assert m["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest(); assert m["apkSize"]==p.stat().st_size; assert m["commitSha"]=="'"$GITHUB_SHA"'"'
          python tools/generate_product_release_manifest.py \
            --phone "$apk" --watch "$wear_apk" --version "$version" \
            --version-code "$code" --source-sha "$GITHUB_SHA" \
            --signer-sha256 "${actual,,}" --output product-release-manifest.json
      - name: Publish immutable release assets
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"; apk="jarvis-assistant-v${version}-release.apk"
          prerelease=""; [[ "$version" == *-* ]] && prerelease="--prerelease"
          wear_apk="jarvis-wear-v${version}-release.apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" "$apk.sha256" "$wear_apk" SHA256SUMS.txt update-manifest.json product-release-manifest.json signing-report.txt wear-signing-report.txt apk-inspection.txt wear-apk-inspection.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Jarvis $version" --notes-file release-notes.txt $prerelease
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" "$wear_apk" SHA256SUMS.txt update-manifest.json product-release-manifest.json signing-report.txt wear-signing-report.txt apk-inspection.txt wear-apk-inspection.txt \
              --verify-tag --target "$GITHUB_SHA" --title "Jarvis $version" --notes-file release-notes.txt $prerelease
          fi
      - name: Publish validated release-hosted channel feeds
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -Eeuo pipefail
          channel="$(python -c 'import json; print(json.load(open("update-manifest.json"))["channel"])')"
          promote() {
            local target="$1" tag="jarvis-$1-feed" previous="$RUNNER_TEMP/$1-previous.json"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release download "$tag" --pattern update-manifest.json --output "$previous"
              python - "$previous" update-manifest.json <<'PY'
          import json, sys
          old, new = (json.load(open(path)) for path in sys.argv[1:])
          if new["versionCode"] <= old["versionCode"]:
              raise SystemExit("OTA channel refuses a reused or decreasing versionCode")
          PY
              gh release upload "$tag" update-manifest.json --clobber
            else
              gh release create "$tag" update-manifest.json --target "$GITHUB_SHA" --prerelease \
                --title "Jarvis ${target^} OTA channel" \
                --notes "Machine-readable OTA channel generated only by approved unified-production release tags."
            fi
          }
          promote "$channel"
          if [[ "$channel" == stable ]]; then promote beta; promote alpha; fi
          if [[ "$channel" == beta ]]; then promote alpha; fi
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ota-${{ github.ref_name }}
          path: |
            jarvis-assistant-*-release.apk
            jarvis-assistant-*-release.apk.sha256
            jarvis-wear-*-release.apk
            SHA256SUMS.txt
            update-manifest.json
            product-release-manifest.json
            signing-report.txt
            wear-signing-report.txt
            apk-inspection.txt
            wear-apk-inspection.txt
          if-no-files-found: error
          retention-days: 30
